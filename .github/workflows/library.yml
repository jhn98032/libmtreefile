name: Build & Test Library

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout library source
      uses: actions/checkout@v4

    - name: Install system dependencies & Qt5
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          autoconf \
          automake \
          libtool \
          pkg-config \
          qtbase5-dev \
          qttools5-dev-tools \
          libzip-dev \
          doxygen \
          graphviz

    - name: Checkout and build libmqtutil
      run: |
        git clone https://github.com/jhn98032/libmqtutil ../libmqtutil
        cd ../libmqtutil
        ./configure --prefix=/usr/local
        make -j$(nproc)
        sudo make install
        sudo ldconfig

    - name: Configure build with Qt paths
      run: |
        # Set PKG_CONFIG_PATH so ./configure finds both Qt5 and lib2
        export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH
        ./configure --prefix=/usr/local

    - name: Compile library
      run: |
        make -j$(nproc)


    - name: Test installation
      run: |
        sudo make install
        sudo ldconfig

